name: Release

# Push a tag like v0.0.1 to build binaries and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog can diff from the last tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # The pushed tag already exists, so skip git; build all binaries and publish.
      - run: bun run scripts/release.ts "${GITHUB_REF_NAME}" --no-git --publish --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REPOSITORY is provided automatically by the runner.
